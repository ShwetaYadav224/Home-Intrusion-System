[project]
name = "homesecurity"
version = "2.0.0"
description = "Home Security Backend — AI-powered face detection, recognition, alerts, and household management API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.4,<6.0",
    "django-cors-headers>=4.6,<5.0",
    "gunicorn>=23.0,<24.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "pillow>=11.0,<12.0",
    "whitenoise>=6.8,<7.0",
    "dj-database-url>=2.3,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "insightface>=0.7,<1.0",
    "onnxruntime>=1.17,<2.0",
    "opencv-python-headless>=4.9,<5.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "homesecurity.settings"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "httpx>=0.28",
]
