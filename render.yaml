services:
  - type: web
    name: homesecurity-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: homesecurity-db
          property: connectionURI
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "anthropic/claude-3-haiku"
      - key: ARCFACE_SIMILARITY_THRESHOLD
        value: "0.5"

databases:
  - name: homesecurity-db
    region: singapore
    plan: free
